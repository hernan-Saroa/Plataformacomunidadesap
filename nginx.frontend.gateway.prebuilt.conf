server {
    listen 80;
    server_name localhost;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    set $esap_csp "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; script-src 'self'; style-src 'self' 'nonce-$request_id'; img-src 'self' data: blob: https://unpkg.com https://images.unsplash.com https://ui-avatars.com https://api.dicebear.com https://api.qrserver.com; font-src 'self' data:; connect-src 'self' https://login.microsoftonline.com https://login.microsoft.com; frame-src 'self' blob: https://login.microsoftonline.com; object-src 'none'; worker-src 'self' blob: https://cdnjs.cloudflare.com; media-src 'self' data: blob:; manifest-src 'self';";

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-ESAP-Frontend-Gateway "prebuilt" always;

    location = /__gateway-build {
        access_log off;
        return 200 "prebuilt\n";
        add_header Content-Type text/plain;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-ESAP-Frontend-Gateway "prebuilt" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /services/certificados/uploads/ {
        alias /usr/share/nginx/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /services/ {
        # Bug 4: subido a 250m para permitir carga de archivos pesados
        client_max_body_size 250m;
        proxy_pass http://api-gateway:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Access-Token $http_x_access_token;
        proxy_hide_header X-Powered-By;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy $esap_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        sub_filter '__ESAP_CSP_NONCE__' '$request_id';
        sub_filter_once off;
    }

    location ~ ^/remotes/[^/]+/assets/remoteEntry\.js$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~ ^/remotes/[^/]+/?$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy $esap_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        sub_filter '__ESAP_CSP_NONCE__' '$request_id';
        sub_filter_once off;
        try_files $uri/index.html =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy $esap_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        sub_filter '__ESAP_CSP_NONCE__' '$request_id';
        sub_filter_once off;
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
