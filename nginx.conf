server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    set $esap_csp "default-src 'self'; base-uri 'self'; frame-ancestors 'self'; object-src 'self' blob: https:; script-src 'self'; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: ws: wss:; frame-src 'self' blob: https:; worker-src 'self' blob: https://cdnjs.cloudflare.com; media-src 'self' data: blob: https:; form-action 'self'; manifest-src 'self';";

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Los remoteEntry de module federation no deben quedar cacheados entre deploys.
    location ~ ^/remotes/[^/]+/assets/remoteEntry\.js$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location ~ ^/remotes/[^/]+/?$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri/index.html =404;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Remotos MFE servidos desde /usr/share/nginx/html/remotes/*
    location /remotes/ {
        try_files $uri =404;
    }

    # Sirve directamente los uploads del gateway sin pasar al backend (requiere volumen en nginx)
    # ^~ evita que el regex de assets intercepte .png/.jpg y devuelva 404 desde /usr/share/nginx/html
    location ^~ /services/certificados/uploads/ {
        alias /usr/share/nginx/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Proxy para servicios backend expuestos en /services/*
    # ^~ tiene prioridad sobre los regex de assets estáticos, evitando que .png/.pdf/etc.
    # sean interceptados por el bloque de caché y devuelvan 404 desde /usr/share/nginx/html
    location ^~ /services/ {
        client_max_body_size 60m;
        proxy_pass http://api-gateway:3000/; # aquí sí va "/" para recortar /services/
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Access-Token $http_x_access_token;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ^~ /onlyoffice/ {
        proxy_pass http://onlyoffice:80/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /externos/correo-institucional {
        return 302 https://outlook.office.com;
    }

    location = /externos/humano-soft {
        return 302 https://humanosoft.esap.edu.co;
    }

    location = /externos/arca {
        return 302 https://arca.esap.edu.co;
    }

    # SPA fallback - todas las rutas van a index.html
    location / {
        # CSP aplicada solo al SPA para no interferir con proxys backend ni OnlyOffice.
        add_header Content-Security-Policy $esap_csp always;
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
