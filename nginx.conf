server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Sirve directamente los uploads del gateway sin pasar al backend (requiere volumen en nginx)
    # ^~ evita que el regex de assets intercepte .png/.jpg y devuelva 404 desde /usr/share/nginx/html
    location ^~ /services/certificados/uploads/ {
        alias /usr/share/nginx/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Solo endpoints que terminen en /upload-file (uploads). Max: 50 MB
    location ~ ^/services/.*/upload-file/?$ {
        client_max_body_size 50m;
        # 🔥 Quitar el prefijo /services/ para que el gateway reciba lo mismo que en location /services/
        rewrite ^/services/(.*)$ /$1 break;
        proxy_pass http://api-gateway:3000;  # sin "/" (por ser regex)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Access-Token $http_x_access_token;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Proxy para servicios backend expuestos en /services/*
    location /services/ {
        proxy_pass http://api-gateway:3000/; # aquí sí va "/" para recortar /services/
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Access-Token $http_x_access_token;
        proxy_cache_bypass $http_upgrade;
    }

    # SPA fallback - todas las rutas van a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
