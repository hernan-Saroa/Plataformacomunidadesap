# Instancia exclusiva del chatbot. Ejecutar con un proyecto independiente:
# docker compose -p esap-chatbot-ai -f docker-compose.chatbot-ia.yml up -d
# No superponer a las composiciones de RUND ni reiniciar sus contenedores.
services:
  chatbot-ollama:
    # Misma imagen ya instalada localmente (Ollama 0.33.3), fijada por digest.
    image: ollama/ollama@sha256:32931b46719f673c05fdbaa81ccb26da18ea4a1c57590a754874ab28ba269eb2
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 5s
    ports:
      - '127.0.0.1:${CHATBOT_OLLAMA_BIND_PORT:-11436}:11434'
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_MAX_QUEUE: '1'
      OLLAMA_CONTEXT_LENGTH: '2048'
      OLLAMA_KEEP_ALIVE: '0'
    volumes:
      - chatbot-ollama-models:/root/.ollama
    # Solo se carga el modelo al solicitar inferencia; se descarga al terminar.
    # La GPU física sigue siendo compartida: no ejecutar a la vez que Gemma.
    gpus: all
    mem_limit: 3g
    cpus: 2
    security_opt:
      - no-new-privileges:true

volumes:
  chatbot-ollama-models:
