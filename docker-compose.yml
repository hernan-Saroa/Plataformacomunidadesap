    environment:
      NODE_ENV: development
      PORT: 3005

      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: 
      DB_NAME: esap_db
      DB_SCHEMA: internal_disciplinary_control

      REDIS_URL: redis://redis:6379
      API_GATEWAY_URL: http://api-gateway:3000
    ports:
      - "3005:3005"
    depends_on:
      - db
      - redis
    networks:
      - superapp-net

  # ============ INTEROPERABILITY SERVICE ============
  interoperability-service:
    build:
      context: ./backend/interoperability-service
      dockerfile: Dockerfile
    container_name: interoperability-service
    env_file:
      - ./backend/interoperability-service/.env
    environment:
      NODE_ENV: development
      PORT: 3006

      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: 
      DB_NAME: esap_db
      DB_SCHEMA: interoperability

      REDIS_URL: redis://redis:6379
      API_GATEWAY_URL: http://api-gateway:3000
    ports:
      - "3006:3006"
    depends_on:
      - db
      - redis
    networks:
      - superapp-net

  # ============ INTERNAL INSTITUTIONAL CONTROL SERVICE ============
  internal-institutional-control-service:
    build:
      context: ./backend/internal-institutional-control-service
      dockerfile: Dockerfile
    container_name: internal-institutional-control-service
    env_file:
      - ./backend/internal-institutional-control-service/.env
    environment:
      NODE_ENV: development
      PORT: 3007

      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: 
      DB_NAME: esap_db
      DB_SCHEMA: internal_institutional_control

      REDIS_URL: redis://redis:6379
      API_GATEWAY_URL: http://api-gateway:3000
    ports:
      - "3007:3007"
    depends_on:
      - db
      - redis
    networks:
      - superapp-net

  # ============ LEGAL MANAGEMENT SERVICE ============
  legal-management-service:
    build:
      context: ./backend/legal-management-service
      dockerfile: Dockerfile
    container_name: legal-management-service
    env_file:
      - ./backend/legal-management-service/.env
    environment:
      NODE_ENV: development
      PORT: 3008

      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: 
      DB_NAME: esap_db
      DB_SCHEMA: legal_management

      REDIS_URL: redis://redis:6379
      API_GATEWAY_URL: http://api-gateway:3000
    ports:
      - "3008:3008"
    depends_on:
      - db
      - redis
    networks:
      - superapp-net

  # ============ NOTIFICATIONS SERVICE ============
  notifications-service:
    build:
      context: ./backend/notifications-service
      dockerfile: Dockerfile
    container_name: notifications-service
    env_file:
      - ./backend/notifications-service/.env
    environment:
      NODE_ENV: development
      PORT: 3009

      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: 
      DB_NAME: esap_db
      DB_SCHEMA: notifications

      REDIS_URL: redis://redis:6379
      API_GATEWAY_URL: http://api-gateway:3000
    ports:
      - "3009:3009"
    depends_on:
      - db
      - redis
    networks:
      - superapp-net

  # ============ TRAVEL EXPENSES SERVICE ============
  travel-expenses-service:
    build:
      context: ./backend/travel-expenses-service
      dockerfile: Dockerfile
    container_name: travel-expenses-service
    env_file:
      - ./backend/travel-expenses-service/.env
    environment:
      NODE_ENV: development
      PORT: 3010

      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: 
      DB_NAME: esap_db
      DB_SCHEMA: travel_expenses

      REDIS_URL: redis://redis:6379
      API_GATEWAY_URL: http://api-gateway:3000
    ports:
      - "3010:3010"
    depends_on:
      - db
      - redis
    networks:
      - superapp-net

  # ============ POSTGRES ============
  db:
    image: postgres:16
    container_name: superapp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: esap_db
      # Para poder usarla sin contraseña dentro del contenedor:
      POSTGRES_HOST_AUTH_METHOD: trust
      # O, si quieres password:
      # POSTGRES_PASSWORD: ""   # y que DB_PASS coincida
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - superapp-net

  # ============ REDIS ============
  redis:
    image: redis:7
    container_name: superapp-redis
    ports:
      - "6379:6379"
    networks:
      - superapp-net

networks:
  superapp-net:

volumes:
  pgdata:
