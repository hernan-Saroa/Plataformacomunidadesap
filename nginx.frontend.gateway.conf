server {
    listen 80;
    server_name localhost;
    server_tokens off;
    set $esap_csp "default-src 'self'; base-uri 'self'; frame-ancestors 'self'; object-src 'self' blob: https:; script-src 'self'; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: ws: wss:; frame-src 'self' blob: https:; worker-src 'self' blob: https://cdnjs.cloudflare.com; media-src 'self' data: blob: https:; form-action 'self'; manifest-src 'self';";

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location ^~ /services/certificados/uploads/ {
        alias /usr/share/nginx/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location ^~ /services/ {
        client_max_body_size 60m;
        proxy_pass http://api-gateway:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Access-Token $http_x_access_token;
        proxy_hide_header X-Powered-By;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ^~ /remotes/mfe-estructura-org/ {
        proxy_pass http://frontend-mfe-estructura-org:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }

    location ^~ /remotes/mfe-gestion-profesoral/ {
