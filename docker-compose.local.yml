services:
  db:
    image: alpine:3.20
    container_name: superapp-db-local-placeholder
    command: ["sh", "-c", "tail -f /dev/null"]
    healthcheck:
      test: ["CMD", "sh", "-c", "exit 0"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - superapp-net

  redis:
    extends:
      file: ./docker-compose.dev.yml
      service: redis

  onlyoffice:
    extends:
      file: ./docker-compose.dev.yml
      service: onlyoffice

  api-gateway:
    extends:
      file: ./docker-compose.dev.yml
      service: api-gateway
    environment:
      CORS_ORIGIN: ${LOCAL_CORS_ORIGIN:-http://localhost}

  auth-service:
    extends:
      file: ./docker-compose.dev.yml
      service: auth-service
    environment:
      DB_HOST: ${LOCAL_DB_HOST:-host.docker.internal}
      DB_PORT: ${LOCAL_DB_PORT:-5432}
      DB_USER: ${LOCAL_DB_USER:-postgres}
      DB_PASS: ${LOCAL_DB_PASSWORD:-postgres}
      DB_NAME: ${LOCAL_DB_NAME:-esap_db}
    depends_on:
      redis:
        condition: service_started

  academic-registration-service:
    extends:
      file: ./docker-compose.dev.yml
      service: academic-registration-service
    environment:
      DB_HOST: ${LOCAL_DB_HOST:-host.docker.internal}
      DB_PORT: ${LOCAL_DB_PORT:-5432}
      DB_USER: ${LOCAL_DB_USER:-postgres}
      DB_PASS: ${LOCAL_DB_PASSWORD:-postgres}
