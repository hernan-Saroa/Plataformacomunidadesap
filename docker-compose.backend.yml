# =============================================================================
# Backend + Base de datos para desarrollo local
# =============================================================================
# Solo lo necesario para trabajar el HU EFDS-1146 (módulo de contratación):
# Postgres real + Redis + los 12 microservicios. Sin frontends (esos van con
# `npm run dev:all`), sin OnlyOffice, sin placeholders.
#
#   docker compose -f docker-compose.backend.yml up -d          # todo
#   docker compose -f docker-compose.backend.yml up -d db hiring-service
#   docker compose -f docker-compose.backend.yml logs -f hiring-service
#   docker compose -f docker-compose.backend.yml down
#
# Nota: aquí Postgres corre DENTRO de compose (host `db`), a diferencia de
# docker-compose.local.yml que usa un placeholder y espera Postgres en el host.
# =============================================================================

x-db-env: &db-env
  DB_HOST: db
  DB_PORT: 5432
  DB_USER: ${DB_USER:-postgres}
  DB_PASS: ${DB_PASSWORD:-postgres}
  DB_NAME: ${DB_NAME:-esap_db}

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - esap-backend
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  # ---------------------------------------------------------------- datos ---
  db:
    image: postgres:16
    container_name: esap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-esap_db}
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "${DB_PORT_HOST:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - esap-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: esap-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT_HOST:-6379}:6379"
    volumes:
      - redisdata:/data
    networks:
      - esap-backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # -------------------------------------------------------------- gateway ---
  api-gateway:
    <<: *service-defaults
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    environment:
      # development: habilita CORS para cualquier puerto de localhost,
      # porque Vite cambia de puerto según cuál esté libre.
      NODE_ENV: ${GATEWAY_NODE_ENV:-development}
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-esap_jwt_secret_change_in_production}
      # OJO: el gateway hace allowedOrigins.push(CORS_ORIGIN) — es UN solo
      # origen, no una lista separada por comas. Ya trae fijos 3000/5173/8080.
      # Si Vite arranca en otro puerto (3007, etc.), ponlo aquí:
      #   CORS_ORIGIN=http://localhost:3007 docker compose -f docker-compose.backend.yml up -d api-gateway
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3114}
      AUTH_SERVICE_URL: http://auth-service:3001
      ACADEMIC_REGISTRATION_SERVICE_URL: http://academic-registration-service:3002
      ACADEMIC_WORK_PLAN_SERVICE_URL: http://academic-work-plan-service:3003
      CERTIFICATION_SERVICE_URL: http://certification-service:3004
      INTERNAL_DISCIPLINARY_CONTROL_SERVICE_URL: http://internal-disciplinary-control-service:3005
      INTEROPERABILITY_SERVICE_URL: http://interoperability-service:3006
      INTERNAL_INSTITUTIONAL_CONTROL_SERVICE_URL: http://internal-institutional-control-service:3007
      LEGAL_MANAGEMENT_SERVICE_URL: http://legal-management-service:3008
      NOTIFICATIONS_SERVICE_URL: http://notifications-service:3009
      TRAVEL_EXPENSES_SERVICE_URL: http://travel-expenses-service:3010
      AUDIT_SERVICE_URL: http://audit-service:3011
      HIRING_SERVICE_URL: http://hiring-service:3012
      ACADEMIC_SCHEDULE_SERVICE_URL: http://academic-schedule-service:3013
      REDIS_URL: redis://redis:6379
    ports:
      # 4000 en el host: es lo que el front espera en desarrollo
      # (apps/shell/src/config/environment.ts). El shell dev usa el 3000.
      - "${GATEWAY_PORT_HOST:-4000}:3000"

  # --------------------------------------------------------- microservicios ---
  auth-service:
    <<: *service-defaults
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    environment:
      <<: *db-env
      NODE_ENV: production
      PORT: 3001
      DB_SCHEMA: auth
      JWT_SECRET: ${JWT_SECRET:-esap_jwt_secret_change_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-esap_refresh_secret_change_in_production}
      JWT_EXPIRES_IN: 1h
      JWT_REFRESH_EXPIRES_IN: 7d
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3001"

  academic-registration-service:
    <<: *service-defaults
    build:
      context: ./backend/academic-registration-service
      dockerfile: Dockerfile
    container_name: academic-registration-service
    environment:
      <<: *db-env
      NODE_ENV: production
      PORT: 3002
      DB_SCHEMA: academic_registration
      JWT_SECRET: ${JWT_SECRET:-esap_jwt_secret_change_in_production}
      REDIS_URL: redis://redis:6379
    ports:
      - "3002:3002"

  academic-work-plan-service:
    <<: *service-defaults
    build:
      context: ./backend/academic-work-plan-service
      dockerfile: Dockerfile
    container_name: academic-work-plan-service
    environment:
      <<: *db-env
      NODE_ENV: production
      PORT: 3003
      DB_SCHEMA: pta
      JWT_SECRET: ${JWT_SECRET:-esap_jwt_secret_change_in_production}
      REDIS_URL: redis://redis:6379
    ports:
      - "3003:3003"

  certification-service:
    <<: *service-defaults
    build:
      context: ./backend/certification-service
      dockerfile: Dockerfile
    container_name: certification-service
    environment:
      <<: *db-env
      NODE_ENV: production
      PORT: 3004
      DB_SCHEMA: certification
      JWT_SECRET: ${JWT_SECRET:-esap_jwt_secret_change_in_production}
      REDIS_URL: redis://redis:6379
    ports:
      - "3004:3004"
    volumes:
      - ./backend/certification-service/uploads:/app/uploads
      - ./backend/certification-service/private-uploads:/app/private-uploads

  internal-disciplinary-control-service:
    <<: *service-defaults
    build:
      context: ./backend/internal-disciplinary-control-service
      dockerfile: Dockerfile
    container_name: internal-disciplinary-control-service
    environment:
      <<: *db-env
      NODE_ENV: production
      PORT: 3005
      DB_SCHEMA: internal_disciplinary_control
      JWT_SECRET: ${JWT_SECRET:-esap_jwt_secret_change_in_production}
      DISCIPLINARY_STORAGE_PATH: /app/uploads
      REDIS_URL: redis://redis:6379
    ports:
      - "3005:3005"
    volumes:
      - ./backend/internal-disciplinary-control-service/uploads:/app/uploads

  interoperability-service:
    <<: *service-defaults
    build:
      context: ./backend/interoperability-service
      dockerfile: Dockerfile
    container_name: interoperability-service
    environment:
      <<: *db-env
      NODE_ENV: production
      PORT: 3006
      JWT_SECRET: ${JWT_SECRET:-esap_jwt_secret_change_in_production}
      REDIS_URL: redis://redis:6379
    ports:
      - "3006:3006"

  internal-institutional-control-service:
    <<: *service-defaults
    build:
      context: ./backend/internal-institutional-control-service
      dockerfile: Dockerfile
    container_name: internal-institutional-control-service
    environment:
      <<: *db-env
      NODE_ENV: production
      PORT: 3007
      DB_SCHEMA: control_interno
      JWT_SECRET: ${JWT_SECRET:-esap_jwt_secret_change_in_production}
      TEMPLATES_PATH: /app/uploads/templates
      REDIS_URL: redis://redis:6379
    ports:
      - "3007:3007"
    volumes:
      - ./backend/internal-institutional-control-service/uploads:/app/uploads

  legal-management-service:
    <<: *service-defaults
    build:
      context: ./backend/legal-management-service
      dockerfile: Dockerfile
    container_name: legal-management-service
    environment:
      <<: *db-env
      NODE_ENV: production
      PORT: 3008
      DB_SCHEMA: legal_management
      JWT_SECRET: ${JWT_SECRET:-esap_jwt_secret_change_in_production}
      REDIS_URL: redis://redis:6379
    ports:
      - "3008:3008"
    volumes:
      - ./backend/legal-management-service/uploads:/app/uploads

  notifications-service:
    <<: *service-defaults
    build:
      context: ./backend/notifications-service
      dockerfile: Dockerfile
    container_name: notifications-service
    environment:
      <<: *db-env
      NODE_ENV: production
      PORT: 3009
      JWT_SECRET: ${JWT_SECRET:-esap_jwt_secret_change_in_production}
      REDIS_URL: redis://redis:6379
    ports:
      - "3009:3009"

  travel-expenses-service:
    <<: *service-defaults
    build:
      context: ./backend/travel-expenses-service
      dockerfile: Dockerfile
    container_name: travel-expenses-service
    environment:
      <<: *db-env
      NODE_ENV: production
      PORT: 3010
      JWT_SECRET: ${JWT_SECRET:-esap_jwt_secret_change_in_production}
      REDIS_URL: redis://redis:6379
    ports:
      - "3010:3010"

  audit-service:
    <<: *service-defaults
    build:
      context: ./backend/audit-service
      dockerfile: Dockerfile
    container_name: audit-service
    environment:
      <<: *db-env
      NODE_ENV: production
      PORT: 3011
      DB_SCHEMA: audit
      JWT_SECRET: ${JWT_SECRET:-esap_jwt_secret_change_in_production}
      REDIS_URL: redis://redis:6379
    ports:
      - "3011:3011"

  # ------------------------------------------- contratación (HU EFDS-1146) ---
  hiring-service:
    <<: *service-defaults
    build:
      context: ./backend/hiring-service
      dockerfile: Dockerfile
    container_name: hiring-service
    environment:
      <<: *db-env
      NODE_ENV: production
      PORT: 3012
      DB_SCHEMA: hiring
      JWT_SECRET: ${JWT_SECRET:-esap_jwt_secret_change_in_production}
      HIRING_STORAGE_PATH: /app/uploads
      REDIS_URL: redis://redis:6379
      API_GATEWAY_URL: http://api-gateway:3000
    ports:
      - "3012:3012"
    volumes:
      - ./backend/hiring-service/uploads:/app/uploads

  academic-schedule-service:
    <<: *service-defaults
    build:
      context: ./backend/academic-schedule-service
      dockerfile: Dockerfile
    container_name: academic-schedule-service
    environment:
      <<: *db-env
      NODE_ENV: production
      PORT: 3013
      DB_SCHEMA: academic-schedule
      JWT_SECRET: ${JWT_SECRET:-esap_jwt_secret_change_in_production}
      REDIS_URL: redis://redis:6379
      API_GATEWAY_URL: http://api-gateway:3000
    ports:
      - "3013:3013"

networks:
  esap-backend:
    driver: bridge
    name: esap-backend

volumes:
  # Reusa el volumen que ya existe (creado por docker-compose.services.yml),
  # donde viven las migraciones ya aplicadas. NO cambiar el nombre: hacerlo
  # arrancaría una base vacía y habría que volver a migrar.
  pgdata:
    external: true
    name: plataformacomunidadesap_pgdata
  redisdata:
    name: esap-redisdata
