# Docker Compose para entorno DEV (Desarrollo del equipo)
# Servidor: http://4.156.71.181
# Uso: docker-compose -f docker-compose.dev.yml up -d --build

services:
  # ============ FRONTEND (React + Vite - Build de producción con Nginx) ============
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.dev
      args:
        # Nueva estructura de URLs: /{service}/api/v{version}/{path}
        # Ejemplo: /auth/api/v1/users
        VITE_API_URL: "/services"
        VITE_ONLYOFFICE_URL: "/onlyoffice"
        VITE_MICROSOFT_TENANT_ID: ${VITE_MICROSOFT_TENANT_ID}
        VITE_MICROSOFT_CLIENT_ID: ${VITE_MICROSOFT_CLIENT_ID}
        VITE_LOGIN_OPTIONS: ${VITE_LOGIN_OPTIONS:-both}
        ESAP_BUILD_DATE: ${ESAP_BUILD_DATE:-}
    container_name: superapp-frontend
    ports:
      - "80:80"
    depends_on:
      - api-gateway
      - onlyoffice
    networks:
      - superapp-net
    restart: unless-stopped
    volumes:
      - ./backend/certification-service/uploads:/usr/share/nginx/uploads:ro

  # ============ ONLYOFFICE DOCUMENT SERVER ============
  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: onlyoffice-server
    ports:
      - "9000:80"
    environment:
      - JWT_ENABLED=false
    volumes:
      - onlyoffice-data:/var/www/onlyoffice/Data
      - onlyoffice-logs:/var/log/onlyoffice
    networks:
      - superapp-net
    restart: unless-stopped

  # ============ API GATEWAY ============
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    environment:
      NODE_ENV: production
      PORT: 3000

      # JWT - debe igualar al auth-service para validar tokens
      JWT_SECRET: ${JWT_SECRET:-esap_jwt_secret_change_in_production}

      # CORS - Permitir acceso desde el frontend
      CORS_ORIGIN: ${CORS_ORIGIN:-NOT_DEFINED}

      # Rutas internas a otros microservicios (DNS de Docker)
      AUTH_SERVICE_URL: http://auth-service:3001
      ACADEMIC_REGISTRATION_SERVICE_URL: http://academic-registration-service:3002
      ACADEMIC_WORK_PLAN_SERVICE_URL: http://academic-work-plan-service:3003
      CERTIFICATION_SERVICE_URL: http://certification-service:3004
      INTERNAL_DISCIPLINARY_CONTROL_SERVICE_URL: http://internal-disciplinary-control-service:3005
      INTEROPERABILITY_SERVICE_URL: http://interoperability-service:3006
      INTERNAL_INSTITUTIONAL_CONTROL_SERVICE_URL: http://internal-institutional-control-service:3007
      LEGAL_MANAGEMENT_SERVICE_URL: http://legal-management-service:3008
      NOTIFICATIONS_SERVICE_URL: http://notifications-service:3009
      TRAVEL_EXPENSES_SERVICE_URL: http://travel-expenses-service:3010
      AUDIT_SERVICE_URL: http://audit-service:3011
      HIRING_SERVICE_URL: http://hiring-service:3012
      ACADEMIC_SCHEDULE_SERVICE_URL: http://academic-schedule-service:3013
    ports:
      - "${API_GATEWAY_PORT:-3000}:3000"
    depends_on:
      - auth-service
      - academic-registration-service
      - academic-work-plan-service
      - certification-service
      - internal-disciplinary-control-service
      - interoperability-service
      - internal-institutional-control-service
      - legal-management-service
      - notifications-service
      - travel-expenses-service
      - audit-service
      - hiring-service
      - academic-schedule-service
    networks:
      - superapp-net
    restart: unless-stopped

  # ============ AUTH SERVICE ============
  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    environment:
      NODE_ENV: production
      PORT: 3001

      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: ${DB_PASSWORD:-esap_secure_password_2024}
      DB_NAME: esap_db
      DB_SCHEMA: auth

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}

      # JWT - IMPORTANTE: Cambiar en producción real
      JWT_SECRET: ${JWT_SECRET:-esap_jwt_secret_change_in_production}
      JWT_EXPIRES_IN: 1h
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-esap_refresh_secret_change_in_production}
      JWT_REFRESH_EXPIRES_IN: 7d

      REDIS_URL: redis://redis:6379
      API_GATEWAY_URL: http://api-gateway:3000
      USER_SERVICE_URL: http://auth-service:3001
      NOTIFICATION_SERVICE_URL: http://notifications-service:3009
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - superapp-net
    restart: unless-stopped

  # ============ ACADEMIC REGISTRATION SERVICE ============
  academic-registration-service:
    build:
      context: ./backend/academic-registration-service
      dockerfile: Dockerfile
    container_name: academic-registration-service
    environment:
      NODE_ENV: production
      PORT: 3002

      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: ${DB_PASSWORD:-esap_secure_password_2024}
      DB_NAME: esap_db
      DB_SCHEMA: academic_registration

      # JWT - debe coincidir con auth-service y api-gateway
      JWT_SECRET: ${JWT_SECRET:-esap_jwt_secret_change_in_production}

      REDIS_URL: redis://redis:6379
      API_GATEWAY_URL: http://api-gateway:3000
      NOTIFICATION_SERVICE_URL: http://notifications-service:3009
      ORACLE_GRAD_ENABLED: ${ORACLE_GRAD_ENABLED:-false}
      ORACLE_GRAD_USER: ${ORACLE_GRAD_USER:-}
      ORACLE_GRAD_PASSWORD: ${ORACLE_GRAD_PASSWORD:-}
      ORACLE_GRAD_CONNECT_STRING: ${ORACLE_GRAD_CONNECT_STRING:-}
      ORACLE_GRAD_SCHEMA: ${ORACLE_GRAD_SCHEMA:-USRINTEGRACION}
      ORACLE_GRAD_VIEW: ${ORACLE_GRAD_VIEW:-VW_INTEGRACIONCERTIFICADO}
      ORACLE_GRAD_CLIENT_LIB_DIR: ${ORACLE_GRAD_CLIENT_LIB_DIR:-}
      ORACLE_CLIENT_LIB_DIR: ${ORACLE_CLIENT_LIB_DIR:-}
      MYSQL_GRAD_ENABLED: ${MYSQL_GRAD_ENABLED:-false}
      MYSQL_GRAD_HOST: ${MYSQL_GRAD_HOST:-}
      MYSQL_GRAD_PORT: ${MYSQL_GRAD_PORT:-3306}
      MYSQL_GRAD_USER: ${MYSQL_GRAD_USER:-}
      MYSQL_GRAD_PASSWORD: ${MYSQL_GRAD_PASSWORD:-}
      MYSQL_GRAD_DATABASE: ${MYSQL_GRAD_DATABASE:-}
      MYSQL_GRAD_VIEW: ${MYSQL_GRAD_VIEW:-vw_integracion}
      MYSQL_GRAD_DOCUMENT_COLUMN: ${MYSQL_GRAD_DOCUMENT_COLUMN:-NUM_IDENTIFICACION}
    ports:
      - "3002:3002"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - superapp-net
    restart: unless-stopped

  # ============ ACADEMIC WORK PLAN SERVICE ============
  academic-work-plan-service:
    build:
      context: ./backend/academic-work-plan-service
      dockerfile: Dockerfile
    container_name: academic-work-plan-service
    environment:
      NODE_ENV: production
      PORT: 3003

      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: ${DB_PASSWORD:-esap_secure_password_2024}
      DB_NAME: esap_db
      DB_SCHEMA: academic_work_plan

      # JWT - debe coincidir con gateway y auth-service
      JWT_SECRET: ${JWT_SECRET:-esap_jwt_secret_change_in_production}

      REDIS_URL: redis://redis:6379
      API_GATEWAY_URL: http://api-gateway:3000
      NOTIFICATION_SERVICE_URL: http://notifications-service:3009
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-NOT_DEFINED}
    ports:
      - "3003:3003"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend/academic-work-plan-service/uploads:/app/uploads
    networks:
      - superapp-net
    restart: unless-stopped

  # ============ CERTIFICATION SERVICE ============
  certification-service:
    build:
      context: ./backend/certification-service
      dockerfile: Dockerfile
    container_name: certification-service
    environment:
      NODE_ENV: production
      PORT: 3004

      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: ${DB_PASSWORD:-esap_secure_password_2024}
      DB_NAME: esap_db
      DB_SCHEMA: certification

      # JWT - debe coincidir con gateway y auth-service
      JWT_SECRET: ${JWT_SECRET:-esap_jwt_secret_change_in_production}

      REDIS_URL: redis://redis:6379
      API_GATEWAY_URL: http://api-gateway:3000
      ORACLE_FNC_ENABLED: ${ORACLE_FNC_ENABLED:-false}
      ORACLE_FNC_USER: ${ORACLE_FNC_USER:-}
      ORACLE_FNC_PASSWORD: ${ORACLE_FNC_PASSWORD:-}
      ORACLE_FNC_CONNECT_STRING: ${ORACLE_FNC_CONNECT_STRING:-}
      ORACLE_FNC_SCHEMA: ${ORACLE_FNC_SCHEMA:-USRINTEGRACION}
      ORACLE_FNC_VIEW: ${ORACLE_FNC_VIEW:-VW_INTEGRACIONFNC}
      ORACLE_CLIENT_LIB_DIR: ${ORACLE_CLIENT_LIB_DIR:-}
    ports:
      - "3004:3004"
    volumes:
      - ./backend/certification-service/uploads:/app/uploads
      - ./backend/certification-service/private-uploads:/app/private-uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - superapp-net
    restart: unless-stopped

  # ============ INTERNAL DISCIPLINARY CONTROL SERVICE ============
  internal-disciplinary-control-service:
    build:
      context: ./backend/internal-disciplinary-control-service
      dockerfile: Dockerfile
    container_name: internal-disciplinary-control-service
    environment:
      NODE_ENV: production
      PORT: 3005

      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: ${DB_PASSWORD:-esap_secure_password_2024}
      DB_NAME: esap_db
      DB_SCHEMA: internal_disciplinary_control

      # JWT - debe coincidir con gateway y auth-service
      JWT_SECRET: ${JWT_SECRET:-esap_jwt_secret_change_in_production}

      REDIS_URL: redis://redis:6379
      API_GATEWAY_URL: http://api-gateway:3000
      NOTIFICATION_SERVICE_URL: http://notifications-service:3009
      DISCIPLINARY_STORAGE_PATH: ${DISCIPLINARY_STORAGE_PATH:-/app/uploads}
    ports:
      - "3005:3005"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ${DISCIPLINARY_STORAGE_HOST_PATH:-./backend/internal-disciplinary-control-service/uploads}:${DISCIPLINARY_STORAGE_PATH:-/app/uploads}
    networks:
      - superapp-net
    restart: unless-stopped

  # ============ INTEROPERABILITY SERVICE ============
  interoperability-service:
    build:
      context: ./backend/interoperability-service
      dockerfile: Dockerfile
    container_name: interoperability-service
    environment:
      NODE_ENV: production
      PORT: 3006

      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: ${DB_PASSWORD:-esap_secure_password_2024}
      DB_NAME: esap_db
      DB_SCHEMA: interoperability

      # JWT - debe coincidir con gateway y auth-service
      JWT_SECRET: ${JWT_SECRET:-esap_jwt_secret_change_in_production}

      REDIS_URL: redis://redis:6379
      API_GATEWAY_URL: http://api-gateway:3000
    ports:
      - "3006:3006"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - superapp-net
    restart: unless-stopped

  # ============ INTERNAL INSTITUTIONAL CONTROL SERVICE ============
  internal-institutional-control-service:
    build:
      context: ./backend/internal-institutional-control-service
      dockerfile: Dockerfile
    container_name: internal-institutional-control-service
    environment:
      NODE_ENV: production
      PORT: 3007

      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: ${DB_PASSWORD:-esap_secure_password_2024}
      DB_NAME: esap_db
      DB_SCHEMA: internal_institutional_control

      # JWT - debe coincidir con gateway y auth-service
      JWT_SECRET: ${JWT_SECRET:-esap_jwt_secret_change_in_production}

      REDIS_URL: redis://redis:6379
      API_GATEWAY_URL: http://api-gateway:3000
      TEMPLATES_PATH: /app/uploads/templates
    ports:
      - "3007:3007"
    volumes:
      - ./backend/internal-institutional-control-service/uploads:/app/uploads
      - ./backend/internal-institutional-control-service/templates:/app/uploads/templates
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - superapp-net
    restart: unless-stopped

  # ============ LEGAL MANAGEMENT SERVICE ============
  legal-management-service:
    build:
      context: ./backend/legal-management-service
      dockerfile: Dockerfile
    container_name: legal-management-service
    environment:
      NODE_ENV: production
      PORT: 3008

      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: ${DB_PASSWORD:-esap_secure_password_2024}
      DB_NAME: esap_db
      DB_SCHEMA: legal_management

      # JWT - debe coincidir con gateway y auth-service
      JWT_SECRET: ${JWT_SECRET:-esap_jwt_secret_change_in_production}

      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
      LEGAL_EMAIL_ACCOUNT: ${LEGAL_EMAIL_ACCOUNT}
      LEGAL_EMAIL_ACCOUNT_JUDICIAL: ${LEGAL_EMAIL_ACCOUNT_JUDICIAL}
      LEGAL_EMAIL_ACCOUNT_CORREOS: ${LEGAL_EMAIL_ACCOUNT_CORREOS}

      REDIS_URL: redis://redis:6379
      API_GATEWAY_URL: http://api-gateway:3000
      CORS_ORIGIN: ${CORS_ORIGIN:-NOT_DEFINED}
    ports:
      - "3008:3008"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - superapp-net
    restart: unless-stopped

  # ============ NOTIFICATIONS SERVICE ============
  notifications-service:
    build:
      context: ./backend/notifications-service
      dockerfile: Dockerfile
    container_name: notifications-service
    environment:
      NODE_ENV: production
      PORT: 3009

      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: ${DB_PASSWORD:-esap_secure_password_2024}
      DB_NAME: esap_db
      DB_SCHEMA: notifications

      # JWT - debe coincidir con gateway y auth-service
      JWT_SECRET: ${JWT_SECRET:-esap_jwt_secret_change_in_production}

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      EMAIL_REDIRECT_TO: ${EMAIL_REDIRECT_TO:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      NOTIFICATIONS_EMAIL_ACCOUNT: ${NOTIFICATIONS_EMAIL_ACCOUNT:-}

      REDIS_URL: redis://redis:6379
      API_GATEWAY_URL: http://api-gateway:3000
    ports:
      - "3009:3009"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - superapp-net
    restart: unless-stopped

  # ============ TRAVEL EXPENSES SERVICE ============
  travel-expenses-service:
    build:
      context: ./backend/travel-expenses-service
      dockerfile: Dockerfile
    container_name: travel-expenses-service
    environment:
      NODE_ENV: production
      PORT: 3010

      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: ${DB_PASSWORD:-esap_secure_password_2024}
      DB_NAME: esap_db
      DB_SCHEMA: travel_expenses

      # JWT - debe coincidir con gateway y auth-service
      JWT_SECRET: ${JWT_SECRET:-esap_jwt_secret_change_in_production}

      REDIS_URL: redis://redis:6379
      API_GATEWAY_URL: http://api-gateway:3000
    ports:
      - "3010:3010"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - superapp-net
    restart: unless-stopped

  # ============ AUDIT SERVICE ============
  audit-service:
    build:
      context: ./backend/audit-service
      dockerfile: Dockerfile
    container_name: audit-service
    environment:
      NODE_ENV: production
      PORT: 3011

      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-esap_secure_password_2024}
      DB_NAME: esap_db

      # JWT - debe coincidir con gateway y auth-service
      JWT_SECRET: ${JWT_SECRET:-esap_jwt_secret_change_in_production}
    ports:
      - "3011:3011"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - superapp-net
    restart: unless-stopped

  # ============ HIRING SERVICE ============
  hiring-service:
    build:
      context: ./backend/hiring-service
      dockerfile: Dockerfile
    container_name: hiring-service
    environment:
      NODE_ENV: production
      PORT: 3012

      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: ${DB_PASSWORD:-esap_secure_password_2024}
      DB_NAME: esap_db
      DB_SCHEMA: hiring

      # JWT - debe coincidir con gateway y auth-service
      JWT_SECRET: ${JWT_SECRET:-esap_jwt_secret_change_in_production}

      REDIS_URL: redis://redis:6379
      API_GATEWAY_URL: http://api-gateway:3000
    ports:
      - "3012:3012"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - superapp-net
    restart: unless-stopped

  # ============ ACADEMIC SCHEDULE SERVICE ============
  academic-schedule-service:
    build:
      context: ./backend/academic-schedule-service
      dockerfile: Dockerfile
    container_name: academic-schedule-service
    environment:
      NODE_ENV: production
      PORT: 3013

      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: ${DB_PASSWORD:-esap_secure_password_2024}
      DB_NAME: esap_db
      DB_SCHEMA: academic-schedule

      JWT_SECRET: ${JWT_SECRET:-esap_jwt_secret_change_in_production}

      REDIS_URL: redis://redis:6379
      API_GATEWAY_URL: http://api-gateway:3000
    ports:
      - "3013:3013"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - superapp-net
    restart: unless-stopped

  # ============ POSTGRES ============
  db:
    image: postgres:16
    container_name: superapp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-esap_secure_password_2024}
      POSTGRES_DB: esap_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - superapp-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d esap_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============ REDIS ============
  redis:
    image: redis:7-alpine
    container_name: superapp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata-dev:/data
    networks:
      - superapp-net
    command: redis-server --appendonly yes

  # ============ SONARQUBE ============
  sonarqube:
    image: sonarqube:10.5-community
    container_name: sonarqube
    restart: unless-stopped
    ports:
      - "9090:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube_db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    depends_on:
      - sonarqube_db
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - superapp-net

  sonarqube_db:
    image: postgres:15
    container_name: sonarqube_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    networks:
      - superapp-net

networks:
  superapp-net:
    driver: bridge

volumes:
  pgdata-dev:
    name: esap-pgdata-dev
  redisdata-dev:
    name: esap-redisdata-dev
  onlyoffice-data:
    name: esap-onlyoffice-data-dev
  onlyoffice-logs:
    name: esap-onlyoffice-logs-dev
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgresql_data:
