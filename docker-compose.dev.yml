    container_name: certification-service
    environment:
      NODE_ENV: production
      PORT: 3004

      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: ${DB_PASSWORD:-esap_secure_password_2024}
      DB_NAME: esap_db
      DB_SCHEMA: certification

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}

      REDIS_URL: redis://redis:6379
      API_GATEWAY_URL: http://api-gateway:3000
    ports:
      - "3004:3004"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - superapp-net
    restart: unless-stopped

  # ============ INTERNAL DISCIPLINARY CONTROL SERVICE ============
  internal-disciplinary-control-service:
    build:
      context: ./backend/internal-disciplinary-control-service
      dockerfile: Dockerfile
    container_name: internal-disciplinary-control-service
    environment:
      NODE_ENV: production
      PORT: 3005

      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: ${DB_PASSWORD:-esap_secure_password_2024}
      DB_NAME: esap_db
      DB_SCHEMA: internal_disciplinary_control

      REDIS_URL: redis://redis:6379
      API_GATEWAY_URL: http://api-gateway:3000
    ports:
      - "3005:3005"
