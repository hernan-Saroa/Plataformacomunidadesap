  # ============ AUDIT SERVICE ============
  audit-service:
    build:
      context: ./backend/audit-service
      dockerfile: Dockerfile
    container_name: audit-service
    environment:
      NODE_ENV: production
      PORT: 3011

      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-esap_secure_password_2024}
      DB_NAME: esap_db
    ports:
      - "3011:3011"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - superapp-net
    restart: unless-stopped

  # ============ POSTGRES ============
  db:
    image: postgres:16
    container_name: superapp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-esap_secure_password_2024}
      POSTGRES_DB: esap_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - superapp-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d esap_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============ REDIS ============
  redis:
    image: redis:7-alpine
    container_name: superapp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata-dev:/data
    networks:
      - superapp-net
    command: redis-server --appendonly yes

networks:
  superapp-net:
    driver: bridge

volumes:
  pgdata-dev:
    name: esap-pgdata-dev
  redisdata-dev:
    name: esap-redisdata-dev
