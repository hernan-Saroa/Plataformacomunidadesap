name: CI - Tests & Build

on:
  push:
    branches: [ develop, qa, main, feature/ci-cd-setup ]
  pull_request:
    branches: [ develop, qa, main ]

jobs:
  # ============ FRONTEND ============
  frontend:
    name: Frontend - Lint & Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Run linter
        run: npm run lint || echo "⚠️ Linter no configurado"
        continue-on-error: true
      
      - name: Type check
        run: npx tsc --noEmit || echo "⚠️ TypeScript check no configurado"
        continue-on-error: true
      
      - name: Build frontend
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/
          retention-days: 7

  # ============ BACKEND SERVICES ============
  backend:
    name: Backend Services - Tests & Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - academic-registration-service
          - academic-work-plan-service
          - certification-service
          - internal-disciplinary-control-service
          - interoperability-service
          - internal-institutional-control-service
          - legal-management-service
          - notifications-service
          - travel-expenses-service
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/${{ matrix.service }}/package-lock.json
      
      - name: Install dependencies
        working-directory: backend/${{ matrix.service }}
        run: |
          # Intentar npm ci primero, si falla usar npm install
          npm ci || npm install
      
      - name: Run linter
        working-directory: backend/${{ matrix.service }}
        run: npm run lint || echo "⚠️ Linter no configurado para ${{ matrix.service }}"
        continue-on-error: true
      
      - name: Run tests
        working-directory: backend/${{ matrix.service }}
        run: npm test || echo "⚠️ Tests no configurados para ${{ matrix.service }}"
        continue-on-error: true
      
      - name: Build service
        working-directory: backend/${{ matrix.service }}
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-build
          path: backend/${{ matrix.service }}/dist/
          retention-days: 7
        if: success() || failure()

