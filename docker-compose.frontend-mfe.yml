x-frontend-build-args: &frontend-build-args
  VITE_API_URL: ${FRONTEND_VITE_API_URL:-http://172.16.202.169/services}
  VITE_ONLYOFFICE_URL: ${FRONTEND_VITE_ONLYOFFICE_URL:-http://172.16.202.169:9000}
  VITE_MICROSOFT_TENANT_ID: ${VITE_MICROSOFT_TENANT_ID}
  VITE_MICROSOFT_CLIENT_ID: ${VITE_MICROSOFT_CLIENT_ID}
  VITE_LOGIN_OPTIONS: ${VITE_LOGIN_OPTIONS:-both}

x-frontend-service: &frontend-service
  networks:
    - ${FRONTEND_NETWORK_KEY:-superapp-net-prod}
  restart: unless-stopped

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.gateway
    container_name: superapp-frontend${FRONTEND_CONTAINER_SUFFIX:--prod}
    ports:
      - "80:80"
    depends_on:
      - frontend-shell
      - frontend-mfe-estructura-org
      - frontend-mfe-gestion-profesoral
      - frontend-mfe-programas-academicos
      - frontend-mfe-gestion-personas
      - frontend-mfe-auditoria
      - frontend-mfe-reportes
      - frontend-mfe-registro-academico
      - frontend-mfe-certificados-laborales
      - frontend-mfe-firma-electronica
      - frontend-mfe-control-interno
      - frontend-mfe-control-disciplinario
      - frontend-mfe-gestion-legal
      - api-gateway
      - onlyoffice
    volumes:
      - ./backend/certification-service/uploads:/usr/share/nginx/uploads:ro
    <<: *frontend-service

  frontend-shell:
    build:
      context: .
      dockerfile: ${FRONTEND_APP_DOCKERFILE:-Dockerfile.frontend.app}
      args:
        <<: *frontend-build-args
        FRONTEND_APP_DIR: shell
        FRONTEND_DIST_DIR: /app/build
        FRONTEND_PREBUILT_DIST_DIR: build
    container_name: superapp-frontend-shell${FRONTEND_CONTAINER_SUFFIX:--prod}
    <<: *frontend-service

  frontend-mfe-estructura-org:
    build:
      context: .
      dockerfile: ${FRONTEND_APP_DOCKERFILE:-Dockerfile.frontend.app}
      args:
        <<: *frontend-build-args
        FRONTEND_APP_DIR: mfe-estructura-org
        FRONTEND_DIST_DIR: /app/build/remotes/mfe-estructura-org
        FRONTEND_PREBUILT_DIST_DIR: build/remotes/mfe-estructura-org
    container_name: superapp-mfe-estructura-org${FRONTEND_CONTAINER_SUFFIX:--prod}
    <<: *frontend-service

  frontend-mfe-gestion-profesoral:
    build:
      context: .
      dockerfile: ${FRONTEND_APP_DOCKERFILE:-Dockerfile.frontend.app}
